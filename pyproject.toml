[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aihub-models"
version = "0.1.0"
description = "AIHub model runtime: ASR, LLM, TTS, diarization, cleanup and meeting minutes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "aihub-common>=0.2",
    "aiohttp>=3.14.3,<4",
    "numpy>=2,<3",
    "psutil>=6,<8",
]

[project.optional-dependencies]
# Local MLX inference. Not needed when every model is a remote HTTP provider.
local = [
    "mlx-lm>=0.31,<0.32",
    "mlx-audio>=0.5.1,<0.6",
    "huggingface_hub>=0.24",
]
# SpeechBrain ECAPA embeddings for speaker diarization.
speaker = ["torch>=2", "speechbrain>=1"]
test = ["pytest>=8"]

[project.scripts]
aihub-models = "aihub_models.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
