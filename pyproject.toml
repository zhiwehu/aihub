[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aihub-common"
version = "0.1.0"
description = "Shared PCM, speech-text and timestamp primitives for AIHub"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
# Only needed when the caller's audio is not already 16 kHz mono s16le.
resample = ["av>=18,<19"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
