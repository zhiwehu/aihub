[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aihub-server"
version = "0.1.0"
description = "AIHub realtime voice server: protocol gateways, sessions and the console API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "aihub-common>=0.2",
    "aihub-tools>=0.1",
    "aiohttp>=3.14.3,<4",
    "numpy>=2,<3",
    "av>=18,<19",
    "onnxruntime>=1.20,<2",
    "psutil>=6,<8",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
# Optional MQTT + UDP transport for devices that cannot use WebSocket.
mqtt = ["aiomqtt>=2.5,<3", "cryptography>=46,<49"]
test = ["pytest>=8"]

[project.scripts]
aihub-server = "aihub_server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
